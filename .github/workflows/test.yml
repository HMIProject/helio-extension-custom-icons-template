name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  run:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # This includes the cache to speed up `npm ci` in the step below.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: package.json

      - name: Install node_modules
        run: npm ci

      - name: Run Tests
        run: npm run test
