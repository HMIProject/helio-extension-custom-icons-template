name: build
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  run:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # This includes the cache to speed up `npm install` in the step below.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: package.json

      - name: Install node_modules
        run: npm install

      - name: Build Extension
        run: npm run build -- -o lib/$(npm run get-name -s)-${{ github.ref_name }}.js

      - name: Copy Static Assets
        run: cp CHANGELOG.md lib

      - name: Zip Extension
        run: zip -9 lib/$(npm run get-name -s)-${{ github.ref_name }}.zip lib/*

      - name: Publish to Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lib/*.js
            lib/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
