name: build
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  run:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # This includes the cache to speed up `npm ci` in the step below.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: package.json

      - name: Install node_modules
        run: npm ci

      # e.g. helio-extension-icons-my-company-v1.2.3, derived from company.config.json
      - name: Determine file name
        id: name
        run: echo "base=$(npm run get-name -s)-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build Extension
        run: npm run build -- -o lib/${{ steps.name.outputs.base }}.js

      - name: Copy Static Assets
        run: cp CHANGELOG.md lib

      - name: Zip Extension
        run: zip -9 lib/${{ steps.name.outputs.base }}.zip lib/*

      - name: Publish to Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lib/*.js
            lib/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
